const vtok=()=>LS.g('vtk')||'',vteam=()=>LS.g('vtm')||'';
async function vapi(op,body,extra=''){const t=vtok();if(!t)throw new Error('Connect your Vercel account first');const idt=await fa.currentUser.getIdToken(),tm=vteam();
 const r=await fetch('/api/vercel?op='+op+extra+(tm?'&team='+encodeURIComponent(tm):''),{method:body?'POST':'GET',headers:Object.assign({Authorization:'Bearer '+idt,'X-Vercel-Token':t},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Vercel request failed ('+r.status+')');return j}
const vstate=s=>({READY:['Ready','ok'],ERROR:['Failed','er'],CANCELED:['Canceled','er'],BUILDING:['Building',''],INITIALIZING:['Starting',''],QUEUED:['Queued',''],DEPLOYING:['Deploying','']}[s]||[s||'Unknown','']);
const vlink=x=>{const l=(x.log||[]).find(s=>String(s).startsWith('Vercel: '));if(!l)return '';const u=String(l).slice(8);return `<div class=mut>${ic('zap',14)} <a href="${esc(u)}" target=_blank rel=noopener>${esc(u.replace(/^https?:\/\//,''))}</a></div>`};
async function vercelPage(){if(!me)return login();
 if(!vtok())return `<article class=lg style="max-width:620px"><h1>Connect Vercel</h1><p>Link your Vercel account to deploy any Verit repository to a real Vercel project, and to see your Vercel projects and deployments right here.</p><ol class=vsteps><li>Open <a href="https://vercel.com/account/tokens" target=_blank rel=noopener>vercel.com/account/tokens</a> and create a token.</li><li>Paste it below. If you deploy to a team, add the team slug too.</li></ol><div class=card2><input id=vt type=password placeholder="Vercel access token" autocomplete=off><input id=vm placeholder="Team slug or ID (optional)" autocomplete=off><button onclick="vconnect()">${ic('zap',16)} Connect Vercel</button><p class=mut style="margin:12px 0 0;font-size:13px">Your token stays in this browser. It is sent only to Verit's server so it can talk to Vercel for you, and it is never saved in the database.</p></div></article>`;
 let u,P,D;try{[u,P,D]=await Promise.all([vapi('me'),vapi('projects'),vapi('deployments')])}catch(e){return `<h2>Vercel</h2><p class=mut>${esc(e.message)}</p><button class=g onclick="vdisconnect()">Disconnect and try again</button>`}
 return `<div class=vh><h2 style="margin:0">${ic('zap',22)} Vercel</h2><span class="pill ok">Connected as ${esc(u.user.username||u.user.name||u.user.email)}</span><div class=sp></div><button class=g onclick="route()">${ic('history',16)} Sync</button><button class=g onclick="vdisconnect()">Disconnect</button></div>
 <div class=sech><h3>Projects</h3></div>${P.projects.map(p=>`<div class=item><div><b>${esc(p.name)}</b><div class=mut>${esc(p.framework||'Static')} · updated ${ago(p.updatedAt)}</div></div>${p.url?`<a href="https://${esc(p.url)}" target=_blank rel=noopener>${ic('external',15)} ${esc(p.url)}</a>`:''}</div>`).join('')||'<div class=empty>No projects yet. Deploy a repository to create one.</div>'}
 <div class=sech><h3>Recent deployments</h3></div>${D.deployments.map(d=>{const s=vstate(d.state);return `<div class=item><div><b>${esc(d.name)}</b> <span class="pill ${s[1]}">${s[0]}</span>${d.target=='production'?' <span class=pill2b>Production</span>':''}<div class=mut>${esc(d.creator||'')} · ${ago(d.created)}</div></div><a href="https://${esc(d.url)}" target=_blank rel=noopener>${ic('external',15)} ${esc(d.url)}</a></div>`}).join('')||'<div class=empty>No deployments yet.</div>'}`}
async function vconnect(){const t=$('#vt').value.trim(),m=$('#vm').value.trim();if(!t)return toast('Paste your Vercel token');LS.s('vtk',t);LS.s('vtm',m);try{await vapi('me')}catch(e){LS.r('vtk');LS.r('vtm');return toast(e.message)}toast('Vercel connected');route()}
const vdisconnect=()=>{LS.r('vtk');LS.r('vtm');toast('Vercel disconnected');route()};
const vbox=r=>{if(!own(r))return '';const nm=LS.g('vpn:'+r.id)||r.slug||r.name;

async function vdeploy(){const r=cur,T0=r.base||r.tree;if(!T0['index.html'])return toast('Add an index.html first');if(pend(r).length)return toast('Commit your changes first');
 const name=($('#vpn').value||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'-').replace(/^[^a-z0-9]+/,'').slice(0,60);if(!name)return toast('Enter a project name');LS.s('vpn:'+r.id,name);
 const box=$('#vp'),S=[],draw=()=>{box.innerHTML=S.map(s=>`<div class="vl${s.d?' d':''}">${s.d?ic('check',15):'<i class=spin></i>'} ${esc(s.t)}</div>`).join('')},step=t=>{S.push({t,d:0});draw()},fin=()=>{S[S.length-1].d=1;draw()};
 try{const n=Object.keys(T0).length;step(`Uploading ${n} file${n>1?'s':''} to Vercel…`);let d=await vapi('deploy',{name,tree:T0});fin();
  step('Building on Vercel…');for(let i=0;i<30&&!['READY','ERROR','CANCELED'].includes(d.state);i++){await new Promise(x=>setTimeout(x,3000));const s=await vapi('status',null,'&id='+encodeURIComponent(d.id));d={...d,state:s.state,url:s.url?'https://'+String(s.url).replace(/^https?:\/\//,''):d.url}}
  if(d.state!='READY')throw new Error(d.state=='ERROR'?'Vercel reported a build error':'Still building. Check the Vercel page in a minute.');fin();step('Live: '+d.url.replace('https://',''));fin();
  const log=[`Snapshot of ${n} files`,'Deployed to Vercel project '+name,'Vercel: '+d.url,'Live'];
  const{data:dep}=await sb.from('deploys').insert({repo_id:r.id,status:'ready',by:me.name,tree:T0,log}).select().single();if(dep)await sb.from('repos').update({prod:dep.id}).eq('id',r.id);
  toast('Deployed to Vercel');setTimeout(route,1400)}catch(e){if(S.length&&!S[S.length-1].d)S.pop();S.push({t:e.message,x:1});box.innerHTML=S.map(s=>s.x?`<div class="vl er">${ic('issues',15)} ${esc(s.t)}</div>`:`<div class="vl${s.d?' d':''}">${ic('check',15)} ${esc(s.t)}</div>`).join('');toast(e.message)}}
